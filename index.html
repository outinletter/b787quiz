<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B787 Systems Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; color: #2d3a5a; min-height: 100vh; }

  header {
    background: #fff;
    padding: 14px 24px;
    border-bottom: 2px solid #dce8ff;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px rgba(100,130,200,0.08);
    flex-wrap: wrap;
  }
  .header-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .logo { font-size: 26px; }
  header h1 { font-size: 18px; color: #3a5ab0; font-weight: 700; letter-spacing: 0.5px; }
  header p { font-size: 12px; color: #8899bb; }

  .system-nav {
    background: #fff;
    padding: 12px 20px;
    border-bottom: 1px solid #dce8ff;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: thin;
    scrollbar-color: #c0d0f0 #fff;
  }
  .system-nav::-webkit-scrollbar { height: 4px; }
  .system-nav::-webkit-scrollbar-thumb { background: #c0d0f0; border-radius: 2px; }

  .sys-btn {
    display: inline-block;
    padding: 7px 15px;
    margin-right: 6px;
    border-radius: 20px;
    border: 1.5px solid #c8d8f4;
    background: #f4f8ff;
    color: #6680bb;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .sys-btn:hover { background: #e4eeff; border-color: #9ab8ee; color: #3a5ab0; }
  .sys-btn.active { background: #4a7aee; color: #fff; border-color: #4a7aee; font-weight: 600; box-shadow: 0 2px 8px rgba(74,122,238,0.25); }

  .random-btn {
    padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #f0a070, #f07090);
    color: #fff; font-size: 13px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(240,100,120,0.25);
    transition: all 0.18s; display: flex; align-items: center; gap: 6px;
  }
  .random-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(240,100,120,0.35); }
  .random-btn:active { transform: translateY(0); }
  .random-reset-btn {
    padding: 7px 14px; border-radius: 16px;
    border: 1.5px solid #f0b0b0; background: #fff8f8;
    color: #c06060; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s;
  }
  .random-reset-btn:hover { background: #fff0f0; border-color: #f08080; }
  .random-info {
    font-size: 12px; color: #99aacc; display: flex; align-items: center; gap: 6px;
  }
  .random-info .pill {
    background: #eef4ff; border: 1px solid #c8d8f4;
    border-radius: 10px; padding: 2px 10px;
    color: #4a7aee; font-weight: 600; font-size: 12px;
  }
  .random-info .pill.warn { background: #fff8ee; border-color: #f0d090; color: #b07020; }

  .main { padding: 24px 20px; max-width: 760px; margin: 0 auto; }

  .sys-title {
    font-size: 17px; font-weight: 700; color: #3a5ab0;
    margin-bottom: 20px; padding-bottom: 10px;
    border-bottom: 2px solid #dce8ff;
    display: flex; align-items: center; gap: 8px;
  }
  .sys-title .count { font-size: 13px; font-weight: 500; color: #7a99cc; }

  .question-card {
    background: #fff;
    border: 1.5px solid #e0eaff;
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(100,130,200,0.06);
    transition: box-shadow 0.2s;
  }
  .question-card:hover { box-shadow: 0 4px 16px rgba(100,130,200,0.1); }

  .q-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .q-num-badge {
    background: #e8f0ff; color: #4a7aee;
    font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 12px;
    white-space: nowrap;
  }
  .q-sys-tag {
    background: #fff0e8; color: #c06030;
    font-size: 11px; font-weight: 600;
    padding: 2px 9px; border-radius: 10px;
    border: 1px solid #f0c8a0;
    white-space: nowrap;
  }
  .q-text {
    font-size: 15px; line-height: 1.7; color: #2d3a5a; font-weight: 500;
  }

  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

  .opt-btn {
    padding: 12px 16px;
    background: #f8faff;
    border: 1.5px solid #dce8ff;
    border-radius: 10px;
    color: #4a5a80;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.5;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .opt-btn:hover:not(:disabled) { background: #eef4ff; border-color: #9ab8ee; color: #2d3a5a; }
  .opt-label { font-weight: 700; color: #9ab8ee; min-width: 18px; }
  .opt-btn:hover:not(:disabled) .opt-label { color: #4a7aee; }

  .opt-btn.correct {
    background: #edfbf3; border-color: #5ecb8a; color: #2a7a4a;
    box-shadow: 0 2px 8px rgba(80,200,120,0.15);
  }
  .opt-btn.correct .opt-label { color: #5ecb8a; }
  .opt-btn.correct::after { content: ' ✓'; font-weight: 700; color: #5ecb8a; margin-left: auto; padding-left: 8px; }

  .opt-btn.wrong {
    background: #fff2f2; border-color: #f4a0a0; color: #b04040;
  }
  .opt-btn.wrong .opt-label { color: #f4a0a0; }
  .opt-btn.wrong::after { content: ' ✗'; font-weight: 700; color: #f4a0a0; margin-left: auto; padding-left: 8px; }

  .opt-btn.reveal {
    background: #edfbf3; border-color: #5ecb8a; color: #2a7a4a; opacity: 0.6;
  }
  .opt-btn.reveal .opt-label { color: #5ecb8a; }
  .opt-btn:disabled { cursor: default; }

  .feedback {
    margin-top: 12px; padding: 12px 16px; border-radius: 10px;
    font-size: 13px; line-height: 1.6; display: none;
    border: 1.5px solid #c8eedd;
    background: #f0fbf5; color: #2a6a44;
  }
  .feedback.show { display: block; }
  .feedback .exp-text { color: #4a7a60; margin-top: 4px; }

  .empty-state {
    text-align: center; padding: 80px 20px; color: #99aacc;
  }
  .empty-state .icon { font-size: 52px; margin-bottom: 14px; }
  .empty-state p { font-size: 16px; color: #aabbd8; }
  .empty-state small { font-size: 13px; color: #c0cce8; display: block; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="logo">✈️</div>
  <div>
    <h1>B787 SYSTEMS QUIZ</h1>
    <p>Type Rating Study</p>
  </div>
  <div class="header-right">
    <button class="random-btn" onclick="startRandom()">🎲 랜덤 20문제</button>
    <div class="random-info">
      <span>출제됨</span>
      <span class="pill" id="rUsed">0</span>
      <span>/ 전체</span>
      <span class="pill" id="rTotal">0</span>
      <button class="random-reset-btn" onclick="resetRandom()" title="출제 기록 초기화">↺ 초기화</button>
    </div>
  </div>
</header>

<div class="system-nav" id="sysNav"></div>


<div class="main" id="mainArea">
  <div class="empty-state">
    <div class="icon">📋</div>
    <p>시스템을 선택하여 문제를 시작하세요</p>
    <small>상단 버튼에서 학습할 시스템을 클릭하세요</small>
  </div>
</div>

<script>
const ALL_QUESTIONS = {
  "1. Airplane General": [
    {
      q: "B787-9의 180° 선회를 위한 최소 포장 도로 폭은?",
      opts: ["140ft (42.7m)", "154ft (47m)", "165ft (50.3m)", "176ft (53.8m)"],
      ans: 1,
      exp: "B787-9 최소 180° 선회 포장 도로 폭은 154ft (47m)입니다. B787-10은 176ft 7in (53.8m)입니다."
    },
    {
      q: "비상등(Emergency Lighting) ARMED 위치의 기능은?",
      opts: [
        "모든 비상등 수동으로만 점등",
        "항공기 전원 차단 시 비상등 자동 점등",
        "플로어 비상등만 자동 점등",
        "완충 배터리 최소 5분 작동"
      ],
      ans: 1,
      exp: "ARMED: 항공기 전원 실패 또는 차단 시 모든 비상등 자동 점등. 완충 배터리는 최소 10분간 작동합니다."
    },
    {
      q: "Halon 소화기를 비행 갑판에서 방출 전 모든 승무원이 먼저 해야 할 것은?",
      opts: [
        "즉시 산소마스크 착용 후 EMERGENCY 100% 선택",
        "창문을 열어 환기시킨다",
        "Fire Suppression Switch를 ON한다",
        "APU를 시동한다"
      ],
      ans: 0,
      exp: "비행 갑판에서 Halon 소화기 방출 전, 모든 승무원은 산소마스크를 착용하고 EMERGENCY 100% 산소를 선택해야 합니다."
    },
    {
      q: "승객 산소마스크가 자동으로 PSU에서 떨어지는 기준은?",
      opts: [
        "13,000ft 또는 출발/도착 공항 고도 + 1,000ft 중 높은 값",
        "14,500ft 또는 출발/도착 공항 고도 + 1,500ft 중 높은 값",
        "14,000ft 또는 출발/도착 공항 고도 + 1,000ft 중 높은 값",
        "13,500ft 또는 출발/도착 공항 고도 + 2,000ft 중 높은 값"
      ],
      ans: 1,
      exp: "마스크는 14,500ft / 출발 공항 고도 + 1,500ft / 도착 공항 고도 + 1,500ft 중 높은 값에 도달하기 전 자동 낙하. 산소 공급 약 60분."
    },
    {
      q: "ELT가 조난 신호를 송신하지 않는 주파수는?",
      opts: ["121.5 MHz", "243 MHz", "325 MHz", "406 MHz"],
      ans: 2,
      exp: "ELT는 121.5 MHz, 243 MHz, 406 MHz로 송신합니다. 325 MHz는 ELT 주파수가 아닙니다."
    },
    {
      q: "비상 접근 코드를 올바르게 입력했을 때 나타나는 현상은?",
      opts: [
        "EICAS 주의 메시지와 키패드 적색 등 점등",
        "EICAS FD DOOR AUTO UNLOCK 경고 메시지와 키패드 황색 등 점등",
        "EICAS 권고 메시지와 키패드 녹색 등 점등",
        "조종실 차임 소리만 발생"
      ],
      ans: 1,
      exp: "올바른 비상 접근 코드 입력 시: EICAS 경고 'FD DOOR AUTO UNLOCK' 및 키패드 황색 등 점등."
    },
    {
      q: "Nose gear landing lights가 점등되지 않는 경우는?",
      opts: [
        "Nose landing gear is down",
        "Nose landing gear lever is not down",
        "Nose landing gear is down and locked",
        "Nose landing gear is not down and locked"
      ],
      ans: 3,
      exp: "기수 착륙등은 Nose landing gear가 down and locked 상태가 아닐 때 점등되지 않습니다."
    },
    {
      q: "Smoke Detector 색상별 현상 중 맞는 것은?",
      opts: [
        "Steady green – 연기 감지됨",
        "Blinking green – 정비 필요",
        "Steady red – 감지기 고장",
        "Blinking red – 전원 정상"
      ],
      ans: 1,
      exp: "Steady green: 전원 정상 & 작동 중. Blinking green: 정비 필요. Steady red: 연기 감지. Blinking red: 감지기 고장."
    },
    {
      q: "화물 도어 취급 시 조작 금지 풍속과 개방 금지 풍속은?",
      opts: [
        "25노트 초과 조작 금지 / 50노트 초과 개방 금지",
        "40노트 초과 조작 금지 / 65노트 초과 개방 금지",
        "35노트 초과 조작 금지 / 60노트 초과 개방 금지",
        "30노트 초과 조작 금지 / 55노트 초과 개방 금지"
      ],
      ans: 1,
      exp: "도어 방향 바람 40노트 초과 시 조작 금지. 돌풍 65노트 초과 시 도어 개방 금지."
    },
    {
      q: "B787 최대 Tiller 조향 각도(Maximum Steering Angle)는?",
      opts: ["60°", "70°", "80°", "90°"],
      ans: 1,
      exp: "Tiller로 좌우 각각 최대 70°까지 조향 가능. 러더 페달로는 좌우 각각 최대 8°."
    },
    {
      q: "정상 전원 상실 시 승객 출입문 창문(Electronically Dimmable Window)은?",
      opts: ["자동으로 어두워진다", "자동으로 투명해진다", "수동으로만 변경 가능", "변화 없음"],
      ans: 1,
      exp: "정상 전원 차단 시 도어 창문은 자동으로 투명(clear)해집니다. 최대 1분 소요될 수 있습니다."
    },
    {
      q: "Cabin entry door가 Automatic mode(Armed)임을 확인하는 방법은?",
      opts: [
        "모드 선택 레버가 GREEN 밴드 위 + 자동 표시등 점등",
        "모드 선택 레버가 RED 밴드 위 + 자동 표시등 깜박임",
        "모드 선택 레버가 RED 밴드에 완전히 위치 + 자동 표시등 점등(깜박이지 않음)",
        "모드 선택 레버가 GREEN 밴드 위 + 도어 표시등 점등"
      ],
      ans: 2,
      exp: "Automatic mode: 모드 선택 레버가 RED 밴드에 완전히 위치, 자동 표시등이 점등(깜박이지 않음)."
    },
    {
      q: "Towing Battery Charge Light – LOW의 의미는?",
      opts: ["최소 60분 남음", "최소 30분 남음", "최소 15분 남음", "최소 5분 남음"],
      ans: 2,
      exp: "HIGH: 최소 60분, MEDIUM: 최소 30분, LOW: 최소 15분 (정상 견인 기준)."
    },
    {
      q: "SEAT BELT SIGNS 스위치 AUTO 시 자동 점등되는 조건이 아닌 것은?",
      opts: [
        "착륙 장치 미수납 및 미잠금",
        "플랩 레버 5 이상",
        "객실 고도 8,000ft 초과",
        "객실 고도 10,000ft 초과"
      ],
      ans: 2,
      exp: "AUTO 자동 점등: 기어 미수납/미잠금 / 플랩 레버 5 이상 / 항공기 고도 항공사 설정 고도 미만 / 객실 고도 10,000ft 초과 / 승객 산소 ON. '8,000ft'는 해당 없음."
    },
    {
      q: "비상등 시스템 배터리에 대한 설명으로 맞는 것은?",
      opts: [
        "중앙 배터리 하나로 모든 비상등 공급",
        "항공기 전기 시스템으로 충전 유지, 완충 시 최소 10분 작동",
        "비상등 전용 AC 배터리 사용",
        "완충 배터리는 정확히 10분 작동"
      ],
      ans: 1,
      exp: "비상등 시스템은 원격 배터리로 작동하며, 항공기 전기 시스템으로 충전을 유지합니다. 완충된 배터리는 최소 10분간 작동합니다."
    }
  ],

  "2. Air Systems": [
    {
      q: "ALTN 황색 등 점등 시 Forward/Aft Outflow Valve가 자동 재위치되는 고도는?",
      opts: [
        "10,000ft 미만 및 지상이 아닐 때",
        "13,000ft 미만 및 지상이 아닐 때",
        "14,000ft 미만 및 지상이 아닐 때",
        "20,000ft 미만 및 지상이 아닐 때"
      ],
      ans: 1,
      exp: "13,000ft 미만 및 지상이 아닐 때 전방 OFV → 10시, 후방 OFV → 1시 방향으로 자동 재위치."
    },
    {
      q: "FMC에서 순항 고도 사용 불가 시 기본(default) 순항 고도는?",
      opts: ["42,000ft", "42,100ft", "43,000ft", "43,100ft"],
      ans: 2,
      exp: "FMC 순항 고도 미사용 시 기본값: 43,000ft."
    },
    {
      q: "정상 순항 객실 고도와 저하 운영 시 최대 객실 고도는?",
      opts: ["5,000ft / 7,000ft", "6,000ft / 8,000ft", "5,000ft / 8,000ft", "6,000ft / 7,000ft"],
      ans: 1,
      exp: "정상 순항 시 6,000ft 이하, 일부 저하 운영 시 최대 8,000ft."
    },
    {
      q: "착륙 고도 FMC 미사용/MAN 미설정 시 EICAS 메시지와 가정 착륙 고도는?",
      opts: [
        "CABIN ALTITUDE / 2,000ft",
        "LANDING ALTITUDE / 1,000ft",
        "CABIN ALTITUDE / 1,000ft",
        "LANDING ALTITUDE / 2,000ft"
      ],
      ans: 3,
      exp: "EICAS 권고 LANDING ALTITUDE 표시, 객실 고도 컨트롤러는 착륙 고도 2,000ft 가정."
    },
    {
      q: "TRIM AIR 스위치 FAULT (amber) 점등 조건이 아닌 것은?",
      opts: [
        "Trim air valve가 closed 상태로 고장",
        "Zone supply duct 과열로 valve가 closed 명령됨",
        "Trim air valve가 open 명령됨",
        "TRIM AIR 스위치가 OFF로 선택됨"
      ],
      ans: 2,
      exp: "FAULT amber: valve closed 고장 / zone 과열로 closed 명령 / TRIM AIR 스위치 OFF. 'Valve open 명령'은 FAULT 조건이 아닙니다."
    },
    {
      q: "AIR COND RESET 스위치 PUSH 시 잘못된 설명은?",
      opts: [
        "공조 결함 리셋 및 정상 작동 재시도",
        "과열/제어 실패/밸브 고장으로 닫힌 Trim air valve 리셋",
        "고장난 재순환 팬 리셋 시도",
        "결함 보호 리셋"

      exp: "Warning 메시지(Red)는 CANC/RCL로 취소할 수 없습니다. Caution 메시지(Amber)는 CANC/RCL로 취소/재호출 가능."
    },
    {
      q: "이륙 구성 경고 CONFIG RUDDER가 억제되는 속도는?",
      opts: [
        "V1 이상",
        "30노트 초과",
        "80노트 초과",
        "60노트 초과"
      ],
      ans: 1,
      exp: "이륙 구성 경고는 V1에서 억제됩니다. 단, CONFIG RUDDER는 30노트 초과 시 별도로 억제됩니다."
    },
    {
      q: "EICAS Status 메시지의 의미는?",
      opts: [
        "비정상 상태에 대한 주요 경보 수단",
        "운항 파견 능력에 영향을 줄 수 있는 장비 결함",
        "정상 상태에 대한 승무원 메모",
        "통신 상태 및 메시지 안내"
      ],
      ans: 1,
      exp: "EICAS 메시지 종류: Alert(비정상 경보) / Communication(통신 안내) / Memo(정상 상태 메모) / Status(파견 능력 영향 장비 결함)."
    }
  ]
};

let currentSystem = null;
let usedRandomKeys = new Set(); // "systemName::qi" format
let currentRandomMode = false;

function getAllQList() {
  const list = [];
  Object.keys(ALL_QUESTIONS).forEach(sys => {
    ALL_QUESTIONS[sys].forEach((q, qi) => {
      list.push({ sys, qi, key: `${sys}::${qi}` });
    });
  });
  return list;
}

function getTotalCount() {
  return Object.values(ALL_QUESTIONS).reduce((s, qs) => s + qs.length, 0);
}

function updateRandomInfo() {
  document.getElementById('rUsed').textContent = usedRandomKeys.size;
  document.getElementById('rTotal').textContent = getTotalCount();
  const usedEl = document.getElementById('rUsed');
  usedEl.className = usedRandomKeys.size >= getTotalCount() ? 'pill warn' : 'pill';
}

function resetRandom() {
  usedRandomKeys.clear();
  updateRandomInfo();
  const area = document.getElementById('mainArea');
  area.innerHTML = `<div class="empty-state"><div class="icon">🔄</div><p>출제 기록이 초기화되었습니다</p><small>랜덤 20문제 버튼을 눌러 시작하세요</small></div>`;
  currentRandomMode = false;
  document.querySelectorAll('.sys-btn').forEach(b => b.classList.remove('active'));
  currentSystem = null;
}

function startRandom() {
  const all = getAllQList();
  const remaining = all.filter(item => !usedRandomKeys.has(item.key));

  if (remaining.length === 0) {
    showAllDoneMessage();
    return;
  }

  // shuffle remaining
  for (let i = remaining.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
  }

  const picked = remaining.slice(0, 20);
  picked.forEach(item => usedRandomKeys.add(item.key));
  updateRandomInfo();

  currentRandomMode = true;
  currentSystem = null;
  document.querySelectorAll('.sys-btn').forEach(b => b.classList.remove('active'));

  renderQuestions(picked.map(item => ({
    ...ALL_QUESTIONS[item.sys][item.qi],
    _tag: item.sys
  })), `🎲 랜덤 출제 — ${picked.length}문제`, true);

  if (usedRandomKeys.size >= getTotalCount()) {
    setTimeout(showAllDoneMessage, 300);
  }
}

function showAllDoneMessage() {
  const area = document.getElementById('mainArea');
  const existed = area.querySelector('.all-done-banner');
  if (existed) return;
  const banner = document.createElement('div');
  banner.className = 'all-done-banner';
  banner.innerHTML = `
    <div style="background:linear-gradient(135deg,#eefaf4,#e8f4ff);border:2px solid #a0dbb0;border-radius:16px;padding:24px 28px;margin-bottom:20px;text-align:center;">
      <div style="font-size:36px;margin-bottom:8px;">🎉</div>
      <div style="font-size:17px;font-weight:700;color:#2a7a4a;margin-bottom:6px;">모든 문제를 완료했습니다!</div>
      <div style="font-size:13px;color:#4a8a60;">전체 ${getTotalCount()}문제를 모두 출제했습니다. 초기화 후 다시 시작할 수 있습니다.</div>
      <button onclick="resetRandom()" style="margin-top:14px;padding:9px 24px;border-radius:20px;border:none;background:#4a7aee;color:#fff;font-weight:700;font-size:13px;cursor:pointer;">↺ 처음부터 다시</button>
    </div>
  `;
  area.insertBefore(banner, area.firstChild);
}

function buildNav() {
  const nav = document.getElementById('sysNav');
  Object.keys(ALL_QUESTIONS).forEach(sys => {
    const btn = document.createElement('button');
    btn.className = 'sys-btn';
    btn.textContent = sys;
    btn.onclick = () => {
      currentRandomMode = false;
      document.querySelectorAll('.sys-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSystem = sys;
      const qs = ALL_QUESTIONS[sys].map((q, qi) => ({ ...q, _tag: null }));
      renderQuestions(qs, `✈️ ${sys}`, false);
    };
    nav.appendChild(btn);
  });
}

function renderQuestions(qs, title, showTag) {
  const area = document.getElementById('mainArea');
  const count = qs.length;
  let html = `<div class="sys-title">${title} <span class="count">— 총 ${count}문제</span></div>`;

  qs.forEach((q, qi) => {
    const labels = ['A', 'B', 'C', 'D'];
    const tagHtml = showTag && q._tag ? `<span class="q-sys-tag">${q._tag}</span>` : '';
    let optsHtml = q.opts.map((opt, oi) => `
      <button class="opt-btn" onclick="answer(${qi}, ${oi})" id="opt-${qi}-${oi}">
        <span class="opt-label">${labels[oi]}</span>
        <span>${opt}</span>
      </button>
    `).join('');

    html += `
      <div class="question-card" id="card-${qi}">
        <div class="q-header">
          <span class="q-num-badge">Q${qi + 1}</span>
          ${tagHtml}
        </div>
        <div class="q-text">${q.q}</div>
        <div class="options" id="opts-${qi}">${optsHtml}</div>
        <div class="feedback" id="fb-${qi}">
          <strong>✅ 정답!</strong>
          ${q.exp ? `<div class="exp-text">📖 ${q.exp}</div>` : ''}
        </div>
      </div>
    `;
  });

  area.innerHTML = html;
  // store qs for answer lookup
  area._qs = qs;
}

function answer(qi, oi) {
  const area = document.getElementById('mainArea');
  const qs = area._qs;
  if (!qs) return;
  const q = qs[qi];
  const optsEl = document.getElementById(`opts-${qi}`);
  const fbEl = document.getElementById(`fb-${qi}`);
  if (optsEl.dataset.answered) return;

  if (oi === q.ans) {
    optsEl.dataset.answered = '1';
    document.getElementById(`opt-${qi}-${oi}`).classList.add('correct');
    q.opts.forEach((_, i) => {
      document.getElementById(`opt-${qi}-${i}`).disabled = true;
    });
    fbEl.classList.add('show');
  } else {
    const btn = document.getElementById(`opt-${qi}-${oi}`);
    btn.classList.add('wrong');
    btn.disabled = true;
  }
}

// init
updateRandomInfo();
buildNav();
</script>
</body>
</html>
