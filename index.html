<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B787 Systems Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f7fc;color:#1e2a45;min-height:100vh}

/* ── HEADER ── */
.header{background:#fff;border-bottom:1px solid #e0e8f8;padding:0 20px;display:flex;align-items:center;gap:12px;height:56px;position:sticky;top:0;z-index:100}
.header-logo{font-size:20px}
.header-title{font-size:15px;font-weight:700;color:#2a4ab0;letter-spacing:.3px}
.header-sub{font-size:11px;color:#8899bb;margin-top:1px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ── TEXT SIZE CONTROLLER ── */
.size-control{display:flex;align-items:center;background:#f0f4ff;border:1px solid #d0dcf8;border-radius:8px;padding:2px}
.size-btn{background:none;border:none;color:#4a7aee;font-size:12px;font-weight:700;padding:5px 10px;cursor:pointer;border-radius:6px;transition:all .15s}
.size-btn:hover{background:#e0eafc}
.size-btn:active{background:#ccdcf8}

.rand-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;background:#4a7aee;color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.rand-btn:hover{background:#3a6add}
.rand-chip{display:flex;align-items:center;gap:6px;background:#f0f4ff;border:1px solid #d0dcf8;border-radius:8px;padding:5px 10px;font-size:12px;color:#5570cc}
.rand-chip b{color:#2a4ab0;font-weight:700}
.rand-chip.warn b{color:#b05a00}
.rand-chip.warn{background:#fff8ee;border-color:#f0d090}
.reset-btn{background:none;border:none;color:#7a90cc;cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px;transition:color .15s}
.reset-btn:hover{color:#c05050}

/* ── NAV ── */
.nav-wrap{background:#fff;border-bottom:1px solid #e0e8f8;display:flex;align-items:stretch}
.nav-scroll{overflow-x:auto;display:flex;gap:0;scrollbar-width:none;flex:1}
.nav-scroll::-webkit-scrollbar{display:none}
.sys-btn{flex-shrink:0;padding:0 16px;height:40px;background:none;border:none;border-bottom:2px solid transparent;color:#7a90bb;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:5px}
.sys-btn:hover{color:#3a5aaa;background:#f4f7ff}
.sys-btn.active{color:#4a7aee;border-bottom-color:#4a7aee;background:#f4f8ff}
.sys-btn.fc-type{color:#3a8a5a}
.sys-btn.fc-type.active{color:#2a7a4a;border-bottom-color:#4aae7a;background:#f0fbf5}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}

/* ── MAIN ── */
.main{max-width:740px;margin:0 auto;padding:20px 16px 60px}
.main{padding-bottom:96px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:120;display:flex;gap:10px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #dfe7f5;box-shadow:0 -4px 16px rgba(60,90,140,.12);backdrop-filter:blur(8px)}
.bottom-nav button{width:min(340px,45vw);padding:12px 18px;border:1px solid #cdd9ef;border-radius:10px;background:#fff;color:#49628f;font-size:14px;font-weight:700;cursor:pointer}
.bottom-nav button.primary{background:#4a7aee;border-color:#4a7aee;color:#fff}
.bottom-nav button:disabled{opacity:.4;cursor:default}

/* ── SYSTEM HEADER ── */
.sys-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #e0e8f8}
.sys-header-left{display:flex;align-items:center;gap:10px}
.sys-title-text{font-size:16px;font-weight:700;color:#1e2a45}
.q-count-badge{background:#e8f0ff;color:#4a7aee;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.fc-count-badge{background:#eaf8f0;color:#2a8a5a;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}

/* ── PROGRESS ── */
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.progress-bar{flex:1;height:5px;background:#e8eef8;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#4a7aee;border-radius:3px;transition:width .3s}
.progress-fill.fc{background:#4aae7a}
.progress-text{font-size:11px;color:#7a90bb;white-space:nowrap;font-weight:600}

/* ── QUESTION CARD ── */
.q-card{background:#fff;border:1px solid #e4ecf8;border-radius:12px;padding:20px;margin-bottom:12px;transition:box-shadow .15s}
.q-card:hover{box-shadow:0 2px 12px rgba(80,120,200,.08)}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.q-num{background:#f0f4ff;color:#6888cc;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.q-type-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase}
.q-type-tag.mcq{background:#fff0e0;color:#b06020}
.q-type-tag.fc{background:#e8f8f0;color:#2a7a50}
.sys-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;background:#f0f2f8;color:#7080aa}
.answered-badge{margin-left:auto;font-size:10px;font-weight:700;color:#4aae7a;display:flex;align-items:center;gap:4px}

/* 가변 텍스트 크기 기준 (기본 변수 선언) */
:root {
  --quiz-font-size: 14px;
}
.q-text{font-size:var(--quiz-font-size);line-height:1.75;color:#1e2a45;font-weight:500}

/* ── OPTIONS ── */
.options{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.opt-btn{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;background:#f8faff;border:1px solid #e4ecf8;border-radius:8px;color:#3a4a70;cursor:pointer;font-size:calc(var(--quiz-font-size) - 1px);text-align:left;transition:all .15s;line-height:1.5;width:100%}
.opt-btn:hover:not(:disabled){background:#eef3ff;border-color:#9ab8ee}
.opt-lbl{font-weight:700;color:#a0b8e0;min-width:16px;flex-shrink:0;font-size:calc(var(--quiz-font-size) - 2px);margin-top:1px}
.opt-btn:hover:not(:disabled) .opt-lbl{color:#4a7aee}
.opt-btn.correct{background:#edfaf4;border-color:#5ecb8a;color:#1a5a30}
.opt-btn.correct .opt-lbl{color:#4aae6a}
.opt-btn.wrong{background:#fff2f2;border-color:#f4a0a0;color:#9a3030}
.opt-btn.wrong .opt-lbl{color:#f0a0a0}
.opt-btn:disabled{cursor:default}
.correct-icon{margin-left:auto;color:#4aae6a;font-weight:700;font-size:13px;flex-shrink:0}
.wrong-icon{margin-left:auto;color:#f0a0a0;font-weight:700;font-size:13px;flex-shrink:0}

/* ── FEEDBACK ── */
.feedback{display:none;margin-top:12px;padding:12px 14px;border-radius:8px;background:#edfaf4;border-left:3px solid #4aae7a;font-size:calc(var(--quiz-font-size) - 1px);line-height:1.65;color:#1a5a30}
.feedback.show{display:block}
.feedback .exp{color:#2a6a44;margin-top:5px;font-size:calc(var(--quiz-font-size) - 2px)}

/* ── FLASHCARD ── */
.fc-body{margin-top:14px}
.fc-reveal-btn{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;border:1.5px solid #a0ddb8;background:#f4fbf7;color:#2a7a50;font-size:calc(var(--quiz-font-size) - 1px);font-weight:600;cursor:pointer;transition:all .15s;width:100%}
.fc-reveal-btn:hover{background:#e8f8ee;border-color:#6acc9a}
.fc-reveal-btn.revealed{background:#edfaf4;border-color:#4aae7a;color:#1a5a30}
.fc-reveal-btn .btn-icon{font-size:14px;transition:transform .2s}
.fc-reveal-btn.revealed .btn-icon{transform:rotate(180deg)}
.fc-answer{display:none;margin-top:10px;padding:14px 16px;background:#f2fbf6;border:1px solid #b8e8cc;border-radius:8px;font-size:calc(var(--quiz-font-size) - 1px);line-height:1.85;color:#1a4a30;white-space:pre-wrap}
.fc-answer.show{display:block}

/* ── EMPTY ── */
.empty{text-align:center;padding:70px 20px;color:#9aaabb}
.empty-icon{font-size:44px;margin-bottom:14px}
.empty-title{font-size:16px;font-weight:600;color:#7a90aa;margin-bottom:6px}
.empty-sub{font-size:13px;color:#aabbd0}

/* ── ALL DONE BANNER ── */
.all-done{background:#f0fbf6;border:1.5px solid #90ddb0;border-radius:12px;padding:22px 24px;text-align:center;margin-bottom:20px}
.all-done-icon{font-size:32px;margin-bottom:8px}
.all-done-title{font-size:15px;font-weight:700;color:#1a6a40;margin-bottom:4px}
.all-done-sub{font-size:12px;color:#3a8a5a;margin-bottom:14px}
.reset-all-btn{padding:8px 20px;border-radius:8px;border:none;background:#4a7aee;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.reset-all-btn:hover{background:#3a6add}

@media(max-width:600px){
  .header-title{font-size:13px}
  .header-sub{display:none}
  .rand-btn span{display:none}
  .rand-chip .label{display:none}
  .size-btn{padding:4px 7px;font-size:11px}
  .main{padding:14px 10px 60px}
  .q-card{padding:16px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">✈️</div>
  <div>
    <div class="header-title">B787 SYSTEMS QUIZ</div>
    <div class="header-sub">Type Rating Study</div>
  </div>
  <div class="header-right">
    <div class="size-control">
      <button class="size-btn" onclick="changeFontSize(-1)" title="글자 작게">A-</button>
      <button class="size-btn" onclick="changeFontSize(1)" title="글자 크게">A+</button>
    </div>
    <button class="rand-btn" onclick="startRandom()">
      🎲 <span>랜덤 20문제</span>
    </button>
    <div class="rand-chip" id="randChip">
      <span class="label">출제</span>
      <b id="rUsed">0</b>
      <span>/</span>
      <b id="rTotal">0</b>
      <button class="reset-btn" onclick="resetRandom()" title="초기화">↺</button>
    </div>
  </div>
</div>

<div class="nav-wrap">
  <div class="nav-scroll" id="sysNav"></div>
</div>

<div class="main" id="mainArea">
  <div class="empty">
    <div class="empty-icon">📋</div>
    <div class="empty-title">시스템을 선택하세요</div>
    <div class="empty-sub">상단 탭에서 학습할 시스템을 클릭하거나 🎲 랜덤 20문제를 시작하세요</div>
  </div>
</div>

<script>
const FLASHCARD_QUESTIONS = {
  "Flashcard": [
    { q:"비상등 스위치 OFF / ARMED / ON 위치별 동작을 설명하시오.", ans:`• OFF: 항공기 전원 차단 시에도 비상등 작동 방지\n• ARMED: 항공기 전원 실패 또는 차단 시 모든 비상등 자동 점등\n• ON: 모든 비상등 즉시 점등\n\n완충 배터리 최소 10분 작동` },
    { q:"Cabin entry door Manual(Disarmed) mode 확인 방법을 모두 설명하시오.", ans:`• 모드 선택 레버가 GREEN 밴드에 완전히 위치\n• 도어 Manual mode indicator 점등\n• 도어 자동 표시등(indicator) 미점등\n\n도어 핸들 OPEN 시: Power assist 및 자동 슬라이드/래프트 전개 비활성화` },
    { q:"Halon 소화기 전량 방출 후 마스크 제거 가능 시점은?", ans:`방출 후 최대 7분까지 소화 약제가 잔류 가능\n\n→ 연기가 걷히고 약제가 완전히 소산된 것을 확인 후 마스크 제거\n→ 7분 경과 후에도 육안으로 연기/약제 잔류 반드시 확인` },
    { q:"Standby Cooling Mode를 설명하시오. 냉각이 불충분할 수 있는 상황은?", ans:`팩 제어 내부 결함 시 Normal mode의 백업으로 자동 전환\nEICAS Advisory: PACK MODE (L,R)\nAIR synoptic: STBY COOLING (amber)\n\n주변 공기를 직접 냉각에 활용하므로 불충분한 경우:\n• 외기 온도가 높을 때\n• 저고도 운항 시 (공기 밀도 높고 온도 높음)` },
    { q:"PECS Cool-down period가 필요한 이유를 설명하시오.", ans:`팩 및 유압 EMP 정지 후 즉시 냉각 중단 시:\n1. 잔열 누적 → 전자 장비(LRU) 내부 온도 급상승 → 부품 손상\n2. 냉각수(쿨런트) 열화 → 냉각 효율 장기 저하\n3. 반도체, 절연체, 실링 재료 수명 단축\n\n대기 시간:\n• APU 또는 전방 외부 전원 양쪽 ON: 10분\n• 전방 외부 전원 1개만 ON: 22분` },
    { q:"EQUIP COOLING FWD 결함 시 예상되는 영향을 설명하시오.", ans:`• 양쪽 HUD 불능\n• Weather Radar / GPWS / Transponder·TCAS:\n  - 한쪽만 작동 시 최소 15분 사용 가능\n  - 좌우 교대 사용 시 각 기능 총 30분 사용 가능\n\n조치: SYS PWR 메뉴로 L 또는 R 측 전원을 ON,\n필요 시에만 한쪽씩 사용` },
    { q:"Aft Equipment Cooling 결함 시 예상되는 영향은?", ans:`• 비임계(Non-critical) 전자 장비: 30분 후 고장 가능\n• 임계(Critical) 전자 장비: 345분 후 고장 가능` },
    { q:"지상 Autostart 중단 조건과 비행 중 In-flight Autostart의 차이를 설명하시오.", ans:`지상 Autostart 중단(Abort) 조건:\n• 두 스타터 모두 상실\n• N1 회전 없음\n• 오일 압력 상승 없음\n→ 모터링 없이 즉시 중단, 재시도 없음 / 최대 3회 제한\n\n비행 중 In-flight Autostart:\n• 시도 횟수 제한 없음\n• 일시 중단만 함(Abort 아님):\n  - 기준 EGT 도달 또는 Hung start 감지 시\n• 일부 문제 자동 조치하나 start abort 없음` },
    { q:"Engine Auto-Relight mode를 설명하시오.", ans:`화염 소멸(Flameout) 및 Sub-idle stall 복구를 위한 자동 재점화\n\n활성화 조건: FUEL CONTROL 스위치 RUN + 엔진 idle 이하 (지상/비행 모두)\n\n화염 소멸 또는 롤백 감지 시:\n→ 해당 엔진 양쪽 점화기 모두 작동\n→ 엔진 idle 회복 시 점화기 차단\n\nSub-idle stall 감지 시:\n→ 1초간 연료 차단으로 스톨 해소 시도\n\nEICAS: AUTORELIGHT (white)` },
    { q:"Engine Tailpipe Fire와 Engine Fire의 차이점을 설명하시오.", ans:`Engine Fire (FIRE ENG):\n• 엔진 나셀/파일론 내부 실제 화재\n• 화재 루프(Loop A/B)에서 감지\n• 화재 벨 + Master WARNING + EICAS 경고\n• QRH FIRE ENG checklist 수행\n\nEngine Tailpipe Fire:\n• 테일파이프 내부 잔류 연료의 불완전 연소\n• 주로 지상 시동/정지 중 발생\n• 화재 경고 없음 → 외부 목격 또는 High EGT로 확인\n• 엔진 제어 오작동으로 인한 연료 축적이 주원인` },
    { q:"External Power 엔진 시동과 APU 시동의 차이를 설명하시오.", ans:`External Power 엔진 시동:\n• 전방 외부 전원 최소 90 kVA 2개 필요\n• 2개의 VFSG 사용 → 시동 시간 더 길어짐\n• 부하 차단(Load shedding) 더 많이 발생\n• 후방 외부 전원 추가 + 우측 엔진 먼저 시동 시 부하 차단 감소\n  (전방 2개 + 후방 1개 모두 연결 시에만 효과)\n\nAPU 시동 대비:\n• APU는 VFSG 1개 사용 → 시동 시간 짧음\n• 부하 차단 적음` },
    { q:"착륙 후 비행 제어 시스템 자가 테스트(Self-test) 3단계를 설명하시오.", ans:`1단계 (~90초):\n지상속도 30kt 미만 5초 경과 후 시작\n조건: 플랩·스피드브레이크 수납, 유압 모두 가압\n유압 중단 금지 / 비행 제어 정지 / 지상속도 40kt 미만 유지\n\n2단계 (~55초):\n1단계 완료 + 모든 유압 감압 후 시작\n유압 OFF 유지 / 플랩·스피드브레이크 조작 금지\n\n3단계 (~90초):\n2단계 완료 + 양 엔진 정지 + PMG 전원 OFF 후 수행` },
    { q:"Slat Autogap과 Pregap의 차이를 설명하시오.", ans:`Autogap (Primary mode 전용):\n• 슬랫 중간 위치 + 240 KIAS 미만\n• 높은 AOA 시 슬랫 완전 전개 → 양력·실속 마진 증가\n• AOA 감소 시 슬랫 중간 위치로 복귀\n\nPregap (Secondary mode 전용):\n• Secondary mode는 Autogap 요청에 즉각 반응하기에 너무 느림\n• 플랩 레버 UP 이외 + 240 KIAS 미만 시 슬랫 자동 완전 전개\n• 플랩 레버 UP 또는 240 KIAS 초과 시까지 전개 상태 유지` },
    { q:"Derate Takeoff 중 엔진 고장 시 TOGA로 추력 증가가 올바른 조치인가?", ans:`아니오. 올바르지 않습니다.\n\n• TO 1, TO 2 Derate 시 해당 추력 설정은 이륙 제한(Limitation)\n• 엔진 고장 후 추력 증가 → 방향 제어 상실(Directional control loss) 위험\n• Derate 조건에 맞게 계산된 이륙 속도 사용\n\n※ 비상 상황(Terrain contact 임박)에서만 Full forward 고려\n  EEC Alternate mode 시 overboost 발생 가능 주의` },

    {q:"GEAR DISAGREE 주의 메시지 표시 조건은?",opts:["기어 레버가 DOWN이 아닐 때","정상 이동 시간 후 기어가 잠기지 않았을 때","기어 도어가 닫히지 않았을 때","Nose gear 조향 미작동 시"],ans:1,exp:"GEAR DISAGREE: 정상 이동 시간 후 기어가 UP 또는 DOWN 잠금 상태가 아닐 때."},
    {q:"Parking Brake 'Park and Adjust' 기능은?",opts:["브레이크 온도를 자동으로 측정하는 시스템","파킹 브레이크 적용 후 냉각 중 클램핑 힘을 모니터링 및 조절","브레이크 패드 마마를 자동으로 보상","착륙 후 자동으로 파킹 브레이크 적용"],ans:1,exp:"Park and Adjust: 파킹 브레이크 적용 후 브레이크 상태를 모니터링하고 냉각 중 클램핑 힘을 조절."},
    {q:"CONFIG GEAR 경고음을 침묵시킬 수 없는 경우는?",opts:["기어 미내림 + 스로틀 idle + RA 800ft 미만","플랩 착륙 위치 + 기어 미내림","양쪽 모두 침묵 가능","항상 침묵 가능"],ans:1,exp:"플랩이 착륙 위치이고 기어 미내림: Master WARNING/CAUTION Reset으로 사이렌 침묵 불가. 기어 잠금 또는 GEAR OVRD 선택까지 유지."}

    {q:"SPEEDBRAKE EXTENDED 주의 메시지 표시 조건은?",opts:["지상속도 85kt+ + 레버 35° 미만","RA 15ft 이상 + 레버 ARMED 초과 + (RA 800ft 이하 또는 착륙 플랩 또는 스로틀 idle 5° 초과 15초)","RA 1,000ft 이하 + 레버 전개","착지 후 스피드브레이크 미자동 전개"],ans:1,exp:"SPEEDBRAKE EXTENDED: RA ≥15ft + 레버 ARMED 초과 + (RA ≤800ft / 또는 착륙 플랩 / 또는 스로틀 idle 5° 초과 15초) 중 하나."},

    {q:"EICAS Warning 메시지(Red) 취소 방법은?",opts:["CANC/RCL 스위치 Push","취소 불가","Master WARNING 스위치 Push","해당 시스템 차단"],ans:1,exp:"Warning 메시지(Red)는 CANC/RCL로 취소 불가. Caution 메시지(Amber)는 CANC/RCL로 취소/재호출 가능."},
    {q:"CONFIG RUDDER 이륙 구성 경고 억제 속도는?",opts:["V1 이상","30노트 초과","80노트 초과","60노트 초과"],ans:1,exp:"이륙 구성 경고는 V1에서 억제. 단 CONFIG RUDDER는 30노트 초과 시 별도로 억제."},
    {q:"EICAS Status 메시지의 의미는?",opts:["비정상 상태에 대한 주요 경보 수단","운항 파견 능력에 영향을 줄 수 있는 장비 결함","정상 상태에 대한 승무원 메모","통신 상태 및 메시지 안내"],ans:1,exp:"EICAS 메시지 종류: Alert(비정상 경보) / Communication(통신 안내) / Memo(정상 상태 메모) / Status(파견 능력 영향 장비 결함)."}
  ]
};

let usedRandomKeys = new Set();
let currentQs = [];
let currentIndex = 0;
let currentTitle = '';
let currentShowTag = false;
let currentFontSize = 14; // 기본 폰트 사이즈 저장 변수

// 텍스트 크기 변경 함수
function changeFontSize(direction) {
  currentFontSize += direction;
  if(currentFontSize < 11) currentFontSize = 11; // 최소 크기 제한
  if(currentFontSize > 24) currentFontSize = 24; // 최대 크기 제한
  document.documentElement.style.setProperty('--quiz-font-size', currentFontSize + 'px');
}

function getTotalCount() {
  const mcq = Object.values(ALL_QUESTIONS).reduce((s,qs)=>s+qs.length,0);
  const fc = Object.values(FLASHCARD_QUESTIONS).reduce((s,qs)=>s+qs.length,0);
  return mcq + fc;
}

function getAllQList() {
  const list = [];
  Object.keys(ALL_QUESTIONS).forEach(sys => {
    ALL_QUESTIONS[sys].forEach((q,qi) => list.push({sys,qi,key:`mcq::${sys}::${qi}`,type:'mcq'}));
  });
  Object.keys(FLASHCARD_QUESTIONS).forEach(sys => {
    FLASHCARD_QUESTIONS[sys].forEach((q,qi) => list.push({sys,qi,key:`fc::${sys}::${qi}`,type:'fc'}));
  });
  return list;
}

function updateRandomInfo() {
  const used = usedRandomKeys.size, tot = getTotalCount();
  document.getElementById('rUsed').textContent = used;
  document.getElementById('rTotal').textContent = tot;
  const chip = document.getElementById('randChip');
  chip.className = 'rand-chip' + (used >= tot ? ' warn' : '');
}

function resetRandom() {
  usedRandomKeys.clear();
  updateRandomInfo();
  document.getElementById('mainArea').innerHTML = `<div class="empty"><div class="empty-icon">🔄</div><div class="empty-title">출제 기록 초기화 완료</div><div class="empty-sub">랜덤 20문제 버튼을 눌러 시작하세요</div></div>`;
  document.querySelectorAll('.sys-btn').forEach(b=>b.classList.remove('active'));
}

function startRandom() {
  const all = getAllQList();
  const remaining = all.filter(item=>!usedRandomKeys.has(item.key));
  if (remaining.length === 0) { showAllDone(); return; }
  for(let i=remaining.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[remaining[i],remaining[j]]=[remaining[j],remaining[i]];}
  const picked = remaining.slice(0,20);
  picked.forEach(item=>usedRandomKeys.add(item.key));
  updateRandomInfo();
  document.querySelectorAll('.sys-btn').forEach(b=>b.classList.remove('active'));
  const qs = picked.map(item=>{
    const q = item.type==='mcq' ? ALL_QUESTIONS[item.sys][item.qi] : FLASHCARD_QUESTIONS[item.sys][item.qi];
    return {...q, _tag:item.sys, _type:item.type};
  });
  // shuffle mixed
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
  render(qs, `🎲 랜덤 출제`, true);
  if (usedRandomKeys.size >= getTotalCount()) setTimeout(showAllDone, 400);
}

function showAllDone() {
  const area = document.getElementById('mainArea');
  if (area.querySelector('.all-done')) return;
  const d = document.createElement('div');
  d.className = 'all-done';
  d.innerHTML = `<div class="all-done-icon">🎉</div><div class="all-done-title">모든 문제를 완료했습니다!</div><div class="all-done-sub">전체 ${getTotalCount()}문제를 모두 출제했습니다. 초기화 후 다시 시작할 수 있습니다.</div><button class="reset-all-btn" onclick="resetRandom()">↺ 처음부터 다시</button>`;
  area.insertBefore(d, area.firstChild);
}

function buildNav() {
  const nav = document.getElementById('sysNav');
  Object.keys(ALL_QUESTIONS).forEach(sys => {
    const btn = document.createElement('button');
    btn.className = 'sys-btn';
    btn.textContent = sys;
    btn.onclick = () => {
      document.querySelectorAll('.sys-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const qs = ALL_QUESTIONS[sys].map(q=>({...q,_tag:null,_type:'mcq'}));
      render(qs, `✈️ ${sys}`, false);
    };
    nav.appendChild(btn);
  });
  Object.keys(FLASHCARD_QUESTIONS).forEach(sys => {
    const btn = document.createElement('button');
    btn.className = 'sys-btn fc-type';
    btn.innerHTML = `<span class="nav-dot"></span>${sys}`;
    btn.onclick = () => {
      document.querySelectorAll('.sys-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const qs = FLASHCARD_QUESTIONS[sys].map(q=>({...q,_tag:null,_type:'fc'}));
      render(qs, `📋 ${sys}`, false);
    };
    nav.appendChild(btn);
  });
}

function render(qs, title, showTag) {
  currentQs = qs;
  currentIndex = 0;
  currentTitle = title;
  currentShowTag = showTag;
  renderCurrentCard();
}

function renderCurrentCard() {
  const qs = currentQs;
  const title = currentTitle;
  const showTag = currentShowTag;
  const tot = qs.length;
  const mcqCount = qs.filter(q=>q._type==='mcq').length;
  const fcCount = qs.filter(q=>q._type==='fc').length;
  let countHtml = '';
  if (mcqCount > 0) countHtml += `<span class="q-count-badge">객관식 ${mcqCount}</span>`;
  if (fcCount > 0) countHtml += `<span class="fc-count-badge">Flashcard ${fcCount}</span>`;

  let html = `
    <div class="sys-header">
      <div class="sys-header-left">
        <span class="sys-title-text">${title}</span>
        ${countHtml}
      </div>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      <span class="progress-text" id="progText">0 / ${tot}</span>
    </div>
  `;

  const qi = currentIndex;
  const q = qs[qi];
  if (q) {
    const labels = ['A','B','C','D'];
    const typeTag = q._type==='fc'
      ? `<span class="q-type-tag fc">Flashcard</span>`
      : `<span class="q-type-tag mcq">객관식</span>`;
    const sysTag = showTag && q._tag ? `<span class="sys-tag">${q._tag}</span>` : '';

    if (q._type === 'fc') {
      html += `
        <div class="q-card" id="card-${qi}">
          <div class="q-meta">${typeTag}${sysTag}<span class="q-num">Q${qi+1}</span></div>
          <div class="q-text">${q.q}</div>
          <div class="fc-body">
            <button class="fc-reveal-btn" id="fcbtn-${qi}" onclick="toggleFC(${qi})">
              <span class="btn-icon">▼</span> 정답 보기
            </button>
            <div class="fc-answer" id="fc-${qi}">${q.ans}</div>
          </div>
        </div>`;
    } else {
      const optsHtml = q.opts.map((opt,oi)=>`
        <button class="opt-btn" onclick="answer(${qi},${oi})" id="opt-${qi}-${oi}">
          <span class="opt-lbl">${labels[oi]}</span><span>${opt}</span>
        </button>`).join('');
      html += `
        <div class="q-card" id="card-${qi}">
          <div class="q-meta">${typeTag}${sysTag}<span class="q-num">Q${qi+1}</span></div>
          <div class="q-text">${q.q}</div>
          <div class="options" id="opts-${qi}">${optsHtml}</div>
          <div class="feedback" id="fb-${qi}">
            ✅ <strong>정답!</strong>${q.exp?`<div class="exp">📖 ${q.exp}</div>`:''}
          </div>
        </div>`;
    }
  }

  html += `
    <div class="bottom-nav">
      <button onclick="goToQuestion(-1)" ${currentIndex === 0 ? 'disabled' : ''}>← 이전</button>
      <button class="primary" onclick="goToQuestion(1)" ${currentIndex >= tot - 1 ? 'disabled' : ''}>다음 →</button>
    </div>`;

  document.getElementById('mainArea').innerHTML = html;
  document.getElementById('mainArea')._answered = 0;
}

function goToQuestion(direction) {
  const nextIndex = currentIndex + direction;
  if (nextIndex < 0 || nextIndex >= currentQs.length) return;
  currentIndex = nextIndex;
  renderCurrentCard();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function toggleFC(qi) {
  const el = document.getElementById(`fc-${qi}`);
  const btn = document.getElementById(`fcbtn-${qi}`);
  const show = el.classList.toggle('show');
  btn.classList.toggle('revealed', show);
  btn.innerHTML = show
    ? '<span class="btn-icon">▼</span> 정답 닫기'
    : '<span class="btn-icon">▼</span> 정답 보기';
  if (show) updateProgress(qi, 'fc');
}

function answer(qi, oi) {
  const q = currentQs[qi];
  const optsEl = document.getElementById(`opts-${qi}`);
  if (optsEl.dataset.answered) return;
  if (oi === q.ans) {
    optsEl.dataset.answered = '1';
    const btn = document.getElementById(`opt-${qi}-${oi}`);
    btn.classList.add('correct');
    btn.innerHTML += '<span class="correct-icon">✓</span>';
    q.opts.forEach((_,i)=>{ if(i!==oi) document.getElementById(`opt-${qi}-${i}`).disabled=true; });
    document.getElementById(`fb-${qi}`).classList.add('show');
    updateProgress(qi, 'mcq');
  } else {
    const btn = document.getElementById(`opt-${qi}-${oi}`);
    btn.classList.add('wrong');
    btn.innerHTML += '<span class="wrong-icon">✗</span>';
    btn.disabled = true;
  }
}

function updateProgress(qi, type) {
  const area = document.getElementById('mainArea');
  if (!area._answeredSet) area._answeredSet = new Set();
  if (area._answeredSet.has(qi)) return;
  area._answeredSet.add(qi);
  const done = area._answeredSet.size;
  const tot = currentQs.length;
  const pct = Math.round(done/tot*100);
  const fill = document.getElementById('progFill');
  const text = document.getElementById('progText');
  if (fill) { fill.style.width = pct+'%'; fill.className = 'progress-fill'+(type==='fc'?' fc':''); }
  if (text) text.textContent = `${done} / ${tot}`;
  // add answered badge
  const meta = document.querySelector(`#card-${qi} .q-meta`);
  if (meta && !meta.querySelector('.answered-badge')) {
    const badge = document.createElement('span');
    badge.className = 'answered-badge';
    badge.textContent = '✓ 완료';
    meta.appendChild(badge);
  }
}

updateRandomInfo();
buildNav();
</script>
</body>
</html>
